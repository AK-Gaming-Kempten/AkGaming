name: Deploy GamelyBot

on:
  push:
    branches: ["develop"]
    tags: ["gamelybot/*"]

concurrency:
  group: deploy-gamelybot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  should-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: evaluate
        name: Evaluate GamelyBot Deploy Trigger
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi
          deploy=false
          if printf '%s\n' "$changed_files" | grep -Eq '^(AkGaming\.GamelyBot/|AkGaming\.Core/Notifications/)'; then
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  test:
    needs: should-deploy
    if: ${{ always() && ((github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true') || startsWith(github.ref, 'refs/tags/gamelybot/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AkGaming.GamelyBot/Tests/AkGaming.GamelyBot.Tests.csproj -p:RestoreUseStaticGraphEvaluation=true
      - name: Test
        run: dotnet test AkGaming.GamelyBot/Tests/AkGaming.GamelyBot.Tests.csproj --configuration Release --no-restore

  deploy-test:
    needs:
      - should-deploy
      - test
    if: github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update test checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/test
          git fetch origin develop
          git reset --hard origin/develop

      - name: Apply GamelyBot test migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test
          docker compose --profile tools run --rm gamelybot-migrations update

      - name: Build and deploy GamelyBot test
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test
          docker compose build gamelybot
          docker compose up -d --no-deps gamelybot

      - name: Verify GamelyBot test
        run: |
          set -euo pipefail
          container="akgaming-test-gamelybot-1"

          for attempt in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"

              if [ "$status" = "healthy" ]; then
                  echo "GamelyBot test is healthy"
                  exit 0
              fi

              echo "Waiting for GamelyBot test: $status ($attempt/30)"
              sleep 2
          done

          docker logs --tail=100 "$container"
          exit 1

  deploy-production:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/gamelybot/') && needs.test.result == 'success' }}
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update production checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/prod
          git fetch origin --tags
          git reset --hard "$GITHUB_SHA"

      - name: Apply GamelyBot production migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod
          docker compose --profile tools run --rm gamelybot-migrations update

      - name: Build and deploy GamelyBot production
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod
          docker compose build gamelybot
          docker compose up -d --no-deps gamelybot

      - name: Verify GamelyBot production
        run: |
          set -euo pipefail
          container="akgaming-prod-gamelybot-1"

          for attempt in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"

              if [ "$status" = "healthy" ]; then
                  echo "GamelyBot production is healthy"
                  exit 0
              fi

              echo "Waiting for GamelyBot production: $status ($attempt/30)"
              sleep 2
          done

          docker logs --tail=100 "$container"
          exit 1