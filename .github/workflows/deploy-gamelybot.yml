name: Deploy GamelyBot

on:
  push:
    branches: ["develop"]
    tags: ["gamelybot/*"]

concurrency:
  group: deploy-gamelybot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  should-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: evaluate
        name: Evaluate GamelyBot Deploy Trigger
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi
          deploy=false
          if printf '%s\n' "$changed_files" | grep -Eq '^(AkGaming\.GamelyBot/|AkGaming\.Core/Notifications/)'; then
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  test:
    needs: should-deploy
    if: ${{ always() && ((github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true') || startsWith(github.ref, 'refs/tags/gamelybot/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AkGaming.GamelyBot/Tests/AkGaming.GamelyBot.Tests.csproj -p:RestoreUseStaticGraphEvaluation=true
      - name: Test
        run: dotnet test AkGaming.GamelyBot/Tests/AkGaming.GamelyBot.Tests.csproj --configuration Release --no-restore

  deploy-test:
    needs: [should-deploy, test]
    if: github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      GAMELYBOT_TEST_DB_CONNECTION_STRING: ${{ secrets.GAMELYBOT_TEST_DB_CONNECTION_STRING }}
      DB_SSH_HOST: ${{ secrets.DB_SSH_HOST }}
      DB_SSH_PORT: ${{ secrets.DB_SSH_PORT }}
      DB_SSH_USER: ${{ secrets.DB_SSH_USER }}
      DB_SSH_PRIVATE_KEY: ${{ secrets.DB_SSH_PRIVATE_KEY }}
      DB_SSH_KNOWN_HOSTS: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      DB_TUNNEL_TARGET_HOST: ${{ secrets.DB_TUNNEL_TARGET_HOST }}
      DB_TUNNEL_TARGET_PORT: ${{ secrets.DB_TUNNEL_TARGET_PORT }}
      TEST_DB_TUNNEL_LOCAL_PORT: "55432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*
      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore GamelyBot Migration Project
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.GamelyBot/AkGaming.GamelyBot.csproj -p:RestoreUseStaticGraphEvaluation=true
      - name: Configure SSH For Test Database Tunnel
        if: ${{ env.DB_SSH_HOST != '' && env.DB_SSH_USER != '' && env.DB_SSH_PRIVATE_KEY != '' && env.DB_SSH_KNOWN_HOSTS != '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DB_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Open Test Database SSH Tunnel
        if: ${{ env.DB_SSH_HOST != '' && env.DB_SSH_USER != '' && env.DB_SSH_PRIVATE_KEY != '' && env.DB_SSH_KNOWN_HOSTS != '' }}
        run: |
          target_host="${DB_TUNNEL_TARGET_HOST:-127.0.0.1}"
          target_port="${DB_TUNNEL_TARGET_PORT:-5432}"
          ssh -i ~/.ssh/id_ed25519 \
            -p "${DB_SSH_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -fN \
            -L "127.0.0.1:${TEST_DB_TUNNEL_LOCAL_PORT}:${target_host}:${target_port}" \
            "${DB_SSH_USER}@${DB_SSH_HOST}"
      - name: Validate GamelyBot Test Connection String
        if: ${{ env.GAMELYBOT_TEST_DB_CONNECTION_STRING != '' }}
        env:
          CONNECTION_STRING: ${{ env.GAMELYBOT_TEST_DB_CONNECTION_STRING }}
        run: |
          case "$CONNECTION_STRING" in
            Host=*|Server=*)
              ;;
            *)
              echo "::error::GAMELYBOT_TEST_DB_CONNECTION_STRING must be a raw Npgsql connection string like Host=...;Port=5432;Database=...;Username=...;Password=..."
              echo "::error::Do not include surrounding quotes, a ConnectionStrings__DefaultConnection= prefix, or a postgres:// URL."
              exit 1
              ;;
          esac

          if [ -n "$DB_SSH_HOST" ]; then
            if ! printf '%s\n' "$CONNECTION_STRING" | grep -Eiq '(^|;)(Host|Server)=(127\.0\.0\.1|localhost)(;|$)'; then
              echo "::error::GAMELYBOT_TEST_DB_CONNECTION_STRING must use Host=127.0.0.1 or Host=localhost when DB_SSH_* tunnel secrets are configured."
              exit 1
            fi

            if ! printf '%s\n' "$CONNECTION_STRING" | grep -Eiq "(^|;)Port=${TEST_DB_TUNNEL_LOCAL_PORT}(;|$)"; then
              echo "::error::GAMELYBOT_TEST_DB_CONNECTION_STRING must use Port=${TEST_DB_TUNNEL_LOCAL_PORT} when DB_SSH_* tunnel secrets are configured."
              exit 1
            fi
          fi
      - name: Apply GamelyBot Test Database Migrations
        if: ${{ env.GAMELYBOT_TEST_DB_CONNECTION_STRING != '' }}
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          Database__Provider: Postgres
          ConnectionStrings__DefaultConnection: ${{ env.GAMELYBOT_TEST_DB_CONNECTION_STRING }}
        run: dotnet ef database update --project AkGaming.GamelyBot/AkGaming.GamelyBot.csproj --context GamelyBotDbContext
      - name: Trigger Coolify Test Deploy
        run: |
          curl --fail --request GET "${{ secrets.COOLIFY_WEBHOOK_GAMELYBOT_TEST }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

  deploy-production:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/gamelybot/') && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING: ${{ secrets.GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING }}
      DB_SSH_HOST: ${{ secrets.DB_SSH_HOST }}
      DB_SSH_PORT: ${{ secrets.DB_SSH_PORT }}
      DB_SSH_USER: ${{ secrets.DB_SSH_USER }}
      DB_SSH_PRIVATE_KEY: ${{ secrets.DB_SSH_PRIVATE_KEY }}
      DB_SSH_KNOWN_HOSTS: ${{ secrets.DB_SSH_KNOWN_HOSTS }}
      DB_TUNNEL_TARGET_HOST: ${{ secrets.DB_TUNNEL_TARGET_HOST }}
      DB_TUNNEL_TARGET_PORT: ${{ secrets.DB_TUNNEL_TARGET_PORT }}
      PRODUCTION_DB_TUNNEL_LOCAL_PORT: "55433"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*
      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore GamelyBot Migration Project
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.GamelyBot/AkGaming.GamelyBot.csproj -p:RestoreUseStaticGraphEvaluation=true
      - name: Configure SSH For Production Database Tunnel
        if: ${{ env.DB_SSH_HOST != '' && env.DB_SSH_USER != '' && env.DB_SSH_PRIVATE_KEY != '' && env.DB_SSH_KNOWN_HOSTS != '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DB_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Open Production Database SSH Tunnel
        if: ${{ env.DB_SSH_HOST != '' && env.DB_SSH_USER != '' && env.DB_SSH_PRIVATE_KEY != '' && env.DB_SSH_KNOWN_HOSTS != '' }}
        run: |
          target_host="${DB_TUNNEL_TARGET_HOST:-127.0.0.1}"
          target_port="${DB_TUNNEL_TARGET_PORT:-5432}"
          ssh -i ~/.ssh/id_ed25519 \
            -p "${DB_SSH_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -fN \
            -L "127.0.0.1:${PRODUCTION_DB_TUNNEL_LOCAL_PORT}:${target_host}:${target_port}" \
            "${DB_SSH_USER}@${DB_SSH_HOST}"
      - name: Validate GamelyBot Production Connection String
        if: ${{ env.GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING != '' }}
        env:
          CONNECTION_STRING: ${{ env.GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING }}
        run: |
          case "$CONNECTION_STRING" in
            Host=*|Server=*)
              ;;
            *)
              echo "::error::GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING must be a raw Npgsql connection string like Host=...;Port=5432;Database=...;Username=...;Password=..."
              echo "::error::Do not include surrounding quotes, a ConnectionStrings__DefaultConnection= prefix, or a postgres:// URL."
              exit 1
              ;;
          esac

          if [ -n "$DB_SSH_HOST" ]; then
            if ! printf '%s\n' "$CONNECTION_STRING" | grep -Eiq '(^|;)(Host|Server)=(127\.0\.0\.1|localhost)(;|$)'; then
              echo "::error::GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING must use Host=127.0.0.1 or Host=localhost when DB_SSH_* tunnel secrets are configured."
              exit 1
            fi

            if ! printf '%s\n' "$CONNECTION_STRING" | grep -Eiq "(^|;)Port=${PRODUCTION_DB_TUNNEL_LOCAL_PORT}(;|$)"; then
              echo "::error::GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING must use Port=${PRODUCTION_DB_TUNNEL_LOCAL_PORT} when DB_SSH_* tunnel secrets are configured."
              exit 1
            fi
          fi
      - name: Apply GamelyBot Production Database Migrations
        if: ${{ env.GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING != '' }}
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          Database__Provider: Postgres
          ConnectionStrings__DefaultConnection: ${{ env.GAMELYBOT_PRODUCTION_DB_CONNECTION_STRING }}
        run: dotnet ef database update --project AkGaming.GamelyBot/AkGaming.GamelyBot.csproj --context GamelyBotDbContext
      - name: Trigger Coolify Production Deploy
        run: |
          curl --fail --request GET "${{ secrets.COOLIFY_WEBHOOK_GAMELYBOT }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
