name: Deploy Website

on:
  push:
    branches: ["develop"]
    tags: ["website/*"]

concurrency:
  group: deploy-website-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  should-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate Website Deploy Trigger
        id: evaluate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu

          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$zero_sha" ]; then
            changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B -n 1 "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B "$BEFORE_SHA..$CURRENT_SHA")"
          fi

          deploy=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(AkGaming\.Website/|AkGaming\.Core/)'; then
            deploy=true
          fi

          if printf '%s\n' "$commit_messages" | grep -Eiq '\[[^]]*(Website|All Projects|Core)[^]]*\]'; then
            deploy=true
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy-test:
    needs: should-deploy
    if: github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'

    runs-on:
      - self-hosted
      - akgaming-deploy

    steps:
      - name: Update test checkout
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/repo/test

          git fetch origin develop
          git reset --hard origin/develop
          git clean -fdx

      - name: Build Website test
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/test
          docker compose build website

      - name: Deploy Website test
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/test
          docker compose up -d --no-deps website

      - name: Verify Website test
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/test

          for attempt in $(seq 1 30); do
              if curl --fail --silent \
                  http://127.0.0.1:18087/ \
                  >/dev/null
              then
                  echo "Website test is healthy"
                  exit 0
              fi

              echo "Waiting for Website test ($attempt/30)..."
              sleep 2
          done

          echo "Website test failed health check"
          docker compose logs --tail=100 website
          exit 1


  deploy-production:
    if: startsWith(github.ref, 'refs/tags/website/')

    runs-on:
      - self-hosted
      - akgaming-deploy

    steps:
      - name: Update production checkout
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/repo/prod

          git fetch origin --tags
          git reset --hard "$GITHUB_SHA"
          git clean -fdx

      - name: Build Website production
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/prod
          docker compose build website

      - name: Deploy Website production
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/prod
          docker compose up -d --no-deps website

      - name: Verify Website production
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/prod

          for attempt in $(seq 1 30); do
              if curl --fail --silent \
                  http://127.0.0.1:18107/ \
                  >/dev/null
              then
                  echo "Website production is healthy"
                  exit 0
              fi

              echo "Waiting for Website production ($attempt/30)..."
              sleep 2
          done

          echo "Website production failed health check"
          docker compose logs --tail=100 website
          exit 1
