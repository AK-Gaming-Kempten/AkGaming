name: Deploy Tournaments

on:
  push:
    branches: ["develop"]
    tags: ["tournaments/*"]

concurrency:
  group: deploy-tournaments-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  should-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate Tournaments Deploy Trigger
        id: evaluate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu

          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$zero_sha" ]; then
            changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B -n 1 "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B "$BEFORE_SHA..$CURRENT_SHA")"
          fi

          deploy=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(AkGaming\.Tournaments/|AkGaming\.Core/)'; then
            deploy=true
          fi

          if printf '%s\n' "$commit_messages" | grep -Eiq '\[[^]]*(Tournaments|All Projects|Core)[^]]*\]'; then
            deploy=true
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  test:
    needs: should-deploy
    if: ${{ always() && ((github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true') || startsWith(github.ref, 'refs/tags/tournaments/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Tournaments Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.Tournaments/Tests/AkGaming.Tournaments.Tests.csproj
      - name: Run Tournaments Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet test AkGaming.Tournaments/Tests/AkGaming.Tournaments.Tests.csproj --configuration Release --no-restore

  deploy-test:
    needs:
      - should-deploy
      - test
    if: github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update test checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/test
          git fetch origin develop
          git reset --hard origin/develop

      - name: Apply Tournaments test migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test
          docker compose --profile tools run --rm tournaments-migrations update

      - name: Build and deploy Tournaments test
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test

          docker compose build \
            tournaments-webapi \
            tournaments-frontend

          docker compose up -d --no-deps \
            tournaments-webapi \
            tournaments-frontend

      - name: Verify Tournaments test
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
              api="$(docker inspect -f '{{.State.Health.Status}}' akgaming-test-tournaments-webapi-1)"
              frontend="$(docker inspect -f '{{.State.Health.Status}}' akgaming-test-tournaments-frontend-1)"

              if [ "$api" = "healthy" ] && [ "$frontend" = "healthy" ]; then
                  echo "Tournaments test is healthy"
                  exit 0
              fi

              echo "Waiting: API=$api Frontend=$frontend ($attempt/30)"
              sleep 2
          done

          docker compose logs --tail=100 \
            tournaments-webapi \
            tournaments-frontend

          exit 1

  deploy-production:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/tournaments/') && needs.test.result == 'success' }}
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update production checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/prod
          git fetch origin --tags
          git reset --hard "$GITHUB_SHA"

      - name: Apply Tournaments production migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod
          docker compose --profile tools run --rm tournaments-migrations update

      - name: Build and deploy Tournaments production
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod

          docker compose build \
            tournaments-webapi \
            tournaments-frontend

          docker compose up -d --no-deps \
            tournaments-webapi \
            tournaments-frontend

      - name: Verify Tournaments production
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
              api="$(docker inspect -f '{{.State.Health.Status}}' akgaming-prod-tournaments-webapi-1)"
              frontend="$(docker inspect -f '{{.State.Health.Status}}' akgaming-prod-tournaments-frontend-1)"

              if [ "$api" = "healthy" ] && [ "$frontend" = "healthy" ]; then
                  echo "Tournaments production is healthy"
                  exit 0
              fi

              echo "Waiting: API=$api Frontend=$frontend ($attempt/30)"
              sleep 2
          done

          docker compose logs --tail=100 \
            tournaments-webapi \
            tournaments-frontend

          exit 1