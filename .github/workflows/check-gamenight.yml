name: Check Gamenight
on:
  pull_request:
    paths:
      - 'AkGaming.Gamenight/**'
      - 'AkGaming.Core/**'
      - 'AkGaming.Identity/**'
      - 'AkGaming.Management/**'
      - '.github/workflows/*gamenight.yml'
      - 'Directory.Build.props'
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test AkGaming.Gamenight/Tests -c Release -m:1
      - run: dotnet build AkGaming.Gamenight/Frontend -c Release -m:1
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: dotnet workload install maui-android
      - run: dotnet build AkGaming.Gamenight/Mobile -f net10.0-android -c Debug -m:1 -p:MSBuildEnableWorkloadResolver=true
