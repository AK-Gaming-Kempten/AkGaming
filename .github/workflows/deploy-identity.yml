name: Deploy Identity

on:
  push:
    branches: ["develop"]
    tags: ["identity/*"]

concurrency:
  group: deploy-identity-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  should-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate Identity Deploy Trigger
        id: evaluate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu

          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$zero_sha" ]; then
            changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B -n 1 "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B "$BEFORE_SHA..$CURRENT_SHA")"
          fi

          deploy=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(AkGaming\.Identity/|AkGaming\.Core/)'; then
            deploy=true
          fi

          if printf '%s\n' "$commit_messages" | grep -Eiq '\[[^]]*(Identity|All Projects|Core)[^]]*\]'; then
            deploy=true
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  test:
    needs: should-deploy
    if: ${{ always() && ((github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true') || startsWith(github.ref, 'refs/tags/identity/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Identity Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.Identity/AkGaming.Identity.sln
      - name: Run Identity Application Unit Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet test AkGaming.Identity/Tests/Application.UnitTests/AkGaming.Identity.Application.UnitTests.csproj --configuration Release --no-restore
      - name: Run Identity API Integration Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet test AkGaming.Identity/Tests/Api.IntegrationTests/AkGaming.Identity.Api.IntegrationTests.csproj --configuration Release --no-restore

  deploy-test:
    needs:
      - should-deploy
      - test
    if: github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update test checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/test
          git fetch origin develop
          git reset --hard origin/develop

      - name: Apply Identity test migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test
          docker compose --profile tools run --rm identity-migrations update

      - name: Build and deploy Identity test
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test
          docker compose build identity
          docker compose up -d --no-deps identity

      - name: Verify Identity test
        run: |
          set -euo pipefail
          container="akgaming-test-identity-1"

          for attempt in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"

              if [ "$status" = "healthy" ]; then
                  echo "Identity test is healthy"
                  exit 0
              fi

              echo "Waiting for Identity test: $status ($attempt/30)"
              sleep 2
          done

          docker logs --tail=100 "$container"
          exit 1

  deploy-production:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/identity/') && needs.test.result == 'success' }}
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update production checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/prod
          git fetch origin --tags
          git reset --hard "$GITHUB_SHA"

      - name: Apply Identity production migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod
          docker compose --profile tools run --rm identity-migrations update

      - name: Build and deploy Identity production
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod
          docker compose build identity
          docker compose up -d --no-deps identity

      - name: Verify Identity production
        run: |
          set -euo pipefail
          container="akgaming-prod-identity-1"

          for attempt in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"

              if [ "$status" = "healthy" ]; then
                  echo "Identity production is healthy"
                  exit 0
              fi

              echo "Waiting for Identity production: $status ($attempt/30)"
              sleep 2
          done

          docker logs --tail=100 "$container"
          exit 1