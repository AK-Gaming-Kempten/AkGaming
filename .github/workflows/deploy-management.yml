name: Deploy Management

on:
  push:
    branches: ["develop"]
    tags: ["management/*"]

concurrency:
  group: deploy-management-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  should-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate Management Deploy Trigger
        id: evaluate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu

          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$zero_sha" ]; then
            changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B -n 1 "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B "$BEFORE_SHA..$CURRENT_SHA")"
          fi

          deploy=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(AkGaming\.Management/|AkGaming\.Core/)'; then
            deploy=true
          fi

          if printf '%s\n' "$commit_messages" | grep -Eiq '\[[^]]*(Management|All Projects|Core)[^]]*\]'; then
            deploy=true
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  test:
    needs: should-deploy
    if: ${{ always() && ((github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true') || startsWith(github.ref, 'refs/tags/management/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Management Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.Management/Modules/MemberManagement/Tests/AkGaming.Management.Modules.MemberManagement.Tests.csproj
      - name: Run Management Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet test AkGaming.Management/Modules/MemberManagement/Tests/AkGaming.Management.Modules.MemberManagement.Tests.csproj --configuration Release --no-restore
      - name: Restore Disbursements Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.Management/Modules/Disbursements/Tests/AkGaming.Management.Modules.Disbursements.Tests.csproj -p:RestoreUseStaticGraphEvaluation=true
      - name: Run Disbursements Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet test AkGaming.Management/Modules/Disbursements/Tests/AkGaming.Management.Modules.Disbursements.Tests.csproj --configuration Release --no-restore
      - name: Restore Board Management Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.Management/Modules/BoardManagement/Tests/AkGaming.Management.Modules.BoardManagement.Tests.csproj -p:RestoreUseStaticGraphEvaluation=true
      - name: Run Board Management Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet test AkGaming.Management/Modules/BoardManagement/Tests/AkGaming.Management.Modules.BoardManagement.Tests.csproj --configuration Release --no-restore

  deploy-test:
    needs:
      - should-deploy
      - test
    if: github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'

    runs-on:
      - self-hosted
      - akgaming-deploy

    steps:
      - name: Update test checkout
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/repo/test
          git fetch origin develop
          git reset --hard origin/develop

      - name: Apply Management test migrations
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/test
          docker compose --profile tools run --rm \
            management-migrations update

      - name: Build Management test
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/test
          docker compose build \
            management-webapi \
            management-frontend

      - name: Deploy Management test
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/test
          docker compose up -d --no-deps \
            management-webapi \
            management-frontend

      - name: Verify Management test
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
              api_ok=false
              frontend_ok=false

              curl --fail --silent \
                  http://127.0.0.1:18081/health \
                  >/dev/null && api_ok=true

              curl --fail --silent \
                  http://127.0.0.1:18082/ \
                  >/dev/null && frontend_ok=true

              if [ "$api_ok" = true ] && [ "$frontend_ok" = true ]; then
                  echo "Management test is healthy"
                  exit 0
              fi

              echo "Waiting for Management test ($attempt/30)..."
              sleep 2
          done

          cd /opt/akgaming/deployment/compose/test
          docker compose logs --tail=100 \
            management-webapi \
            management-frontend

          exit 1


  deploy-production:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/management/') && needs.test.result == 'success' }}

    runs-on:
      - self-hosted
      - akgaming-deploy

    steps:
      - name: Update production checkout
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/repo/prod
          git fetch origin --tags
          git reset --hard "$GITHUB_SHA"

      - name: Apply Management production migrations
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/prod
          docker compose --profile tools run --rm \
            management-migrations update

      - name: Build Management production
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/prod
          docker compose build \
            management-webapi \
            management-frontend

      - name: Deploy Management production
        run: |
          set -euo pipefail

          cd /opt/akgaming/deployment/compose/prod
          docker compose up -d --no-deps \
            management-webapi \
            management-frontend

      - name: Verify Management production
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
              api_ok=false
              frontend_ok=false

              curl --fail --silent \
                  http://127.0.0.1:18101/health \
                  >/dev/null && api_ok=true

              curl --fail --silent \
                  http://127.0.0.1:18102/ \
                  >/dev/null && frontend_ok=true

              if [ "$api_ok" = true ] && [ "$frontend_ok" = true ]; then
                  echo "Management production is healthy"
                  exit 0
              fi

              echo "Waiting for Management production ($attempt/30)..."
              sleep 2
          done

          cd /opt/akgaming/deployment/compose/prod
          docker compose logs --tail=100 \
            management-webapi \
            management-frontend

          exit 1