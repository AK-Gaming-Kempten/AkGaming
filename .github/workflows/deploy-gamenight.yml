name: Deploy Gamenight

on:
  push:
    branches: ["develop"]
    tags: ["gamenight/*"]

concurrency:
  group: deploy-gamenight-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  should-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.evaluate.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate Gamenight Deploy Trigger
        id: evaluate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu

          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$zero_sha" ]; then
            changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B -n 1 "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            commit_messages="$(git log --format=%B "$BEFORE_SHA..$CURRENT_SHA")"
          fi

          deploy=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(AkGaming\.Gamenight/|AkGaming\.Core/|\.github/workflows/deploy-gamenight\.yml|scripts/run-gamenight-migrations\.sh$|Directory\.Build\.props)'; then
            deploy=true
          fi

          if printf '%s\n' "$commit_messages" | grep -Eiq '\[[^]]*(Gamenight|All Projects|Core)[^]]*\]'; then
            deploy=true
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  test:
    needs: should-deploy
    if: ${{ always() && ((github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true') || startsWith(github.ref, 'refs/tags/gamenight/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Gamenight Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet restore AkGaming.Gamenight/Tests/AkGaming.Gamenight.Tests.csproj
      - name: Run Gamenight Tests
        env:
          DOTNET_CLI_HOME: /tmp
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: dotnet test AkGaming.Gamenight/Tests/AkGaming.Gamenight.Tests.csproj --configuration Release --no-restore

      - name: Build Gamenight Web Frontend
        run: dotnet build AkGaming.Gamenight/Frontend --configuration Release -m:1

  deploy-test:
    needs:
      - should-deploy
      - test
    if: github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update test checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/test
          git fetch origin develop
          git reset --hard origin/develop

      - name: Apply Gamenight test migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test
          docker compose --profile tools run --rm gamenight-migrations update

      - name: Build and deploy Gamenight test
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test

          docker compose build \
            gamenight-webapi \
            gamenight-frontend

          docker compose up -d --no-deps \
            gamenight-webapi \
            gamenight-frontend

      - name: Verify Gamenight test
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/test

          for attempt in $(seq 1 30); do
              api="$(docker inspect -f '{{.State.Health.Status}}' akgaming-test-gamenight-webapi-1 2>/dev/null)" || api=missing
              frontend="$(docker inspect -f '{{.State.Health.Status}}' akgaming-test-gamenight-frontend-1 2>/dev/null)" || frontend=missing

              if [ "$api" = "healthy" ] && [ "$frontend" = "healthy" ]; then
                  echo "Gamenight test is healthy"
                  exit 0
              fi

              echo "Waiting: API=$api Frontend=$frontend ($attempt/30)"
              sleep 2
          done

          docker compose logs --tail=100 \
            gamenight-webapi \
            gamenight-frontend

          exit 1

  deploy-production:
    needs: test
    if: ${{ always() && startsWith(github.ref, 'refs/tags/gamenight/') && needs.test.result == 'success' }}
    runs-on: [ self-hosted, akgaming-deploy ]

    steps:
      - name: Update production checkout
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/repo/prod
          git fetch origin --tags
          git reset --hard "$GITHUB_SHA"

      - name: Apply Gamenight production migrations
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod
          docker compose --profile tools run --rm gamenight-migrations update

      - name: Build and deploy Gamenight production
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod

          docker compose build \
            gamenight-webapi \
            gamenight-frontend

          docker compose up -d --no-deps \
            gamenight-webapi \
            gamenight-frontend

      - name: Verify Gamenight production
        run: |
          set -euo pipefail
          cd /opt/akgaming/deployment/compose/prod

          for attempt in $(seq 1 30); do
              api="$(docker inspect -f '{{.State.Health.Status}}' akgaming-prod-gamenight-webapi-1 2>/dev/null)" || api=missing
              frontend="$(docker inspect -f '{{.State.Health.Status}}' akgaming-prod-gamenight-frontend-1 2>/dev/null)" || frontend=missing

              if [ "$api" = "healthy" ] && [ "$frontend" = "healthy" ]; then
                  echo "Gamenight production is healthy"
                  exit 0
              fi

              echo "Waiting: API=$api Frontend=$frontend ($attempt/30)"
              sleep 2
          done

          docker compose logs --tail=100 \
            gamenight-webapi \
            gamenight-frontend

          exit 1
